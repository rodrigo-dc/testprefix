name: Test Linux
on: [push]
jobs:
  run-test-sh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: test
        shell: bash
        run: |
          cd test
          ./test.sh
